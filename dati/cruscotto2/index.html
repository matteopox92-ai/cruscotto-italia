<style>
:root{--bg:#05070a;--panel:#0b0f14;--line:#1d232b;--line2:#2a323c;--fg:#d8dde3;--fg2:#8a939e;--acc:#f2b134;--ok:#3ddc84;--warn:#f2b134;--bad:#ff5a4f;--priv:#b48cf2;--blu:#5aa9ff;--mono:Consolas,"Cascadia Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Segoe UI",Arial,sans-serif}
a{color:inherit}
h1,h2,h3,h4{text-transform:uppercase;letter-spacing:.06em;margin:0}
.barra{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:2px;overflow-x:auto;white-space:nowrap;background:var(--bg);border-bottom:1px solid var(--acc);padding:0 12px}
.barra a{padding:11px 9px;text-decoration:none;color:var(--fg2);text-transform:uppercase;font-size:12px;letter-spacing:.05em}
.barra a.on{color:var(--acc)}
.barra a.home{color:var(--acc);font-weight:700;padding-left:0}
.barra .stato{margin-left:auto;display:flex;gap:14px;font-size:12px;padding-left:12px}
.banda{position:sticky;top:40px;z-index:9;display:flex;flex-wrap:wrap;gap:3px 14px;align-items:baseline;background:var(--panel);border-bottom:1px solid var(--line2);padding:6px 12px;font:12px var(--mono)}
.banda:empty{display:none}
.banda a.tit{color:var(--acc);text-decoration:none;text-transform:uppercase;letter-spacing:.05em}
.banda em{font-style:normal;color:var(--fg2)}.banda i{font-style:normal;font-size:11px}
.pall{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;background:currentColor}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 48px}
.testa{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:20px 0 4px}
.testa h1{font-size:20px}
.priv-tag{font-size:11px;color:var(--priv);border:1px solid var(--priv);padding:2px 6px;letter-spacing:.08em}
.sotto{color:var(--fg2);margin:0 0 16px;font-size:13px}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.blocco{background:var(--panel);padding:14px;border-left:3px solid var(--acc);cursor:pointer;text-decoration:none;display:block}
.blocco:hover{background:#10161d}
.blocco.priv{border-left-color:var(--priv)}
.blocco h3{font-size:14px;display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.blocco .n{color:var(--acc);font-family:var(--mono)}
.blocco.priv .n{color:var(--priv)}
.aree{display:flex;flex-wrap:wrap;gap:4px}
.aree a{font-size:12px;padding:3px 7px;border:1px solid var(--line2);color:#b7c0ca;text-decoration:none}
.aree a:hover{border-color:var(--acc);color:var(--acc)}
.blocco .chiave{margin-top:10px;font-size:13px;color:var(--fg2)}
.numeri{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:10px 0}
.numero{background:var(--panel);padding:12px 14px}
.numero .v{font-family:var(--mono);font-size:28px;color:#fff;line-height:1.15}
.numero .e{font-size:12px;color:var(--fg2);margin-top:3px}
.filtro{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 0;font-size:12px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
.filtro button{font:inherit;text-transform:uppercase;padding:5px 9px;background:transparent;color:var(--fg2);border:1px solid var(--line2);cursor:pointer}
.filtro button.on{color:var(--bg);background:var(--acc);border-color:var(--acc)}
.linguette{display:flex;gap:2px;overflow-x:auto;margin:14px 0 0;border-bottom:1px solid var(--line2)}
.linguette a{padding:8px 12px;text-decoration:none;white-space:nowrap;color:var(--fg2);text-transform:uppercase;font-size:12px;letter-spacing:.05em;border:1px solid var(--line);border-bottom:none}
.linguette a.on{color:var(--bg);background:var(--acc);border-color:var(--acc)}
.settore{background:var(--panel);border:1px solid var(--line);padding:14px;margin-top:10px}
.settore h4{font-size:13px;color:#fff;margin-bottom:3px}
.settore h4 .l{color:var(--acc);font-family:var(--mono);margin-right:6px}
.settore>p{margin:0 0 10px;color:var(--fg2);font-size:13px}
.settore.attesa{border-style:dashed;opacity:.75}
.settore.attesa h4 .l{color:var(--fg2)}
.tab{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--fg2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line2);font-weight:600}
td{border-bottom:1px solid #141a21;font-family:var(--mono)}
td.t{font-family:inherit;white-space:normal;text-align:left}
tr.tot td{border-top:1px solid var(--line2);color:#fff}
tr.sel td{background:#151b22}
.st{font-family:"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:600;white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muto{color:var(--fg2)}.acc{color:var(--acc)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--fg2);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.due{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--fg2);margin-top:4px}
.leg i{display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:3px}
svg text{font-family:var(--mono);font-size:10px;fill:var(--fg2)}
.scala{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;margin:4px 0 8px}
.scala div{background:#10161d;border:1px solid var(--line);padding:3px 2px;text-align:center;font-family:var(--mono);font-size:11px}
.scala div b{display:block;color:var(--fg2);font-weight:400;font-size:10px}
.scala div.qui{border-color:var(--acc);color:var(--acc)}
.scala div.fisso{box-shadow:inset 0 -2px 0 var(--ok)}
.barretta{height:6px;background:#141a21;position:relative;min-width:60px}
.barretta span{position:absolute;left:0;top:0;bottom:0}
.prom{white-space:pre-wrap;background:#10161d;border:1px solid var(--line);padding:10px;font-size:13px}
button.copia{font:inherit;font-size:12px;margin-top:6px;padding:5px 10px;background:transparent;color:var(--acc);border:1px solid var(--acc);cursor:pointer}
.gruppo{border:1px solid var(--line);margin-top:8px}
.gruppo summary{padding:8px 10px;font-size:13px;color:var(--fg)}
.gruppo .tab{padding:0 10px 8px}
.guida dt{color:var(--acc);margin-top:8px;font-weight:600}
.guida dd{margin:2px 0 0;color:var(--fg2)}
select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line2);padding:4px 6px}
@media (max-width:600px){.numero .v{font-size:22px}.barra .stato{display:none}
  .stretta table{font-size:12px}.stretta th,.stretta td{padding:5px 4px}.stretta th{letter-spacing:0}
  .banda{font-size:11px;gap:2px 10px;padding:5px 10px}.banda .fuori{display:none}}
</style>
</head>

<script>

  return a >= 1e9 ? s + nf2.format(a / 1e9) + ' mld €' : a >= 1e6 ? s + nf1.format(a / 1e6) + ' M€' : s + nf.format(a) + ' €'; };

function settore(l, titolo, frase, corpo, dettagli) {

// grafico a linee: serie = [{nome, colore, punti:[[x,y]]}], x numeri (ms o indici)
function linea(serie, o = {}) {

  const X = (x) => L + (x - x0) / (x1 - x0) * (W - L - Rr), Y = (y) => Tt + (1 - (y - y0) / (y1 - y0)) * (H - Tt - B);
  const fy = o.fy || n, fx = o.fx || ((x) => x);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3; g += `<line x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1d232b"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${fy(v)}</text>`; }
  if (o.zero && y0 < 0) g += `<line x1="${L}" x2="${W - Rr}" y1="${Y(0)}" y2="${Y(0)}" stroke="#4a5462"/>`;
  g += `<text x="${L}" y="${H - 6}">${fx(x0)}</text><text x="${W - Rr}" y="${H - 6}" text-anchor="end">${fx(x1)}</text>`;
  const linee = serie.map((s) => { const p = s.punti.filter((q) => !vuoto(q[1]));

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.titolo || 'grafico')}">${g}${linee}</svg>` +
    `<div class="leg">${serie.map((s) => `<span><i style="background:${s.colore}"></i>${esc(s.nome)}</span>`).join('')}</div>`;
}
// barre verticali con lo zero: valori = [{e: etichetta, v: numero, c: classe colore}]
function barre(valori, o = {}) {
  const W = 760, H = o.h || 200, L = 64, Tt = 10, B = 22;
  if (!valori.length) return '<p class="muto">Nessun dato.</p>';
  const vs = valori.map((x) => +x.v || 0); let y0 = Math.min(0, ...vs), y1 = Math.max(0, ...vs); if (y0 === y1) y1 = 1;
  const Y = (y) => Tt + (1 - (y - y0) / (y1 - y0)) * (H - Tt - B), bw = (W - L) / valori.length;
  const fy = o.fy || n; let g = '';
  for (let i = 0; i <= 2; i++) { const v = y0 + (y1 - y0) * i / 2; g += `<text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${fy(v)}</text><line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1d232b"/>`; }
  const passo = Math.ceil(valori.length / 12);
  valori.forEach((x, i) => { const v = +x.v || 0, a = Y(Math.max(v, 0)), b = Y(Math.min(v, 0));
    g += `<rect x="${L + i * bw + 1}" y="${a}" width="${Math.max(1, bw - 2)}" height="${Math.max(1, b - a)}" fill="var(--${x.c || (v < 0 ? 'bad' : 'acc')})"><title>${esc(x.e)}: ${fy(v)}</title></rect>`;
    if (i % passo === 0) g += `<text x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(x.e)}</text>`; });
  g += `<line x1="${L}" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#4a5462"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.titolo || 'grafico a barre')}">${g}</svg>`;
}

const pref = { get(k, d) { try { return localStorage.getItem('c2.' + k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('c2.' + k, v); } catch (e) { /* niente */ } } };

// ------------------------------------------------------------------ disegno della pagina
// banda del tesoro dello Stato in risorse, in cima a ogni pagina (utente, 30/10/2026: «sempre sotto controllo … la cosa più
// importante»): valore dell'ultima lettura e variazione da inizio giornata; nel suggerimento anche quella dalla lettura prima
function banda() {
  const tr = D.tesoro_recente; if (!tr || !tr.serie.length) return '';
  const s = tr.serie, ora = s[s.length - 1], prec = s[s.length - 2] || ora, inizio = s.find((x) => x.g === tr.giorno) || ora;
  const fmt = (k, v) => k === 'denaro' ? nf1.format(v / 1e6) + ' M€' : v >= 1e6 ? nf2.format(v / 1e6) + ' M' : nf.format(Math.round(v / 1e3)) + ' k';
  const pct = (k) => { const d = ora[k] - inizio[k]; return `<i class="${d < 0 ? 'bad' : d > 0 ? 'ok' : 'muto'}">${d ? segno(inizio[k] ? d / inizio[k] * 100 : null, d1) + '%' : '='}</i>`; };
  return `<a href="#/stato/tesoro" class="tit">Tesoro</a>` + R5.map((k) => `<span title="${NOME_R[k]}: ${n(ora[k])} · dalla lettura prima ${segno(ora[k] - prec[k])} · da inizio giornata ${segno(ora[k] - inizio[k])}">${k === 'denaro' ? '' : `<em>${k === 'nte' ? 'NTE' : NOME_R[k].slice(0, 3).toLowerCase()}</em> `}<b>${fmt(k, ora[k])}</b> ${pct(k)}</span>`).join('') +
    `<span class="muto fuori">da inizio giornata (${oraIt(inizio.ts).slice(-5)})</span>`;
}
function macroVisibili() { return MACRO.filter((m) => !m.priv || D.privata); }
function disegna() {
  const [, mId, aId] = (location.hash || '#/').split('/');
  const vis = macroVisibili(), m = vis.find((x) => x.id === mId);
  const eta = etaLettura(), sal = eta > 75 ? 'warn' : D.salute.fonti.every((f) => f.stato === 'verde') ? 'ok' : 'warn';
  document.getElementById('barra').innerHTML = `<a href="#/" class="home">ITA ◆</a>${vis.map((x) => `<a href="#/${x.id}" class="${m && m.id === x.id ? 'on' : ''}">${x.nome}</a>`).join('')}` +
    `<span class="stato"><span class="${sal}"><span class="pall"></span>${sal === 'ok' ? 'Dati freschi' : 'Controlla i dati'} · ${n(eta)} min</span><span>Confini fra ${hm(oreAddebito())}</span></span>`;
  const ban = document.getElementById('banda');
  ban.innerHTML = banda();
  ban.style.top = document.getElementById('barra').offsetHeight + 'px';
  const pag = document.getElementById('pagina');
  const priv = D.privata ? '<span class="priv-tag">VERSIONE PRIVATA · CON I NOMI</span>' : '';
  if (!m) {
    pag.innerHTML = `<div class="testa"><h1>Cruscotto Economia Italia</h1>${priv}</div><p class="sotto">Dati del ${oraIt(D.lettura.ora)}. Clic su un blocco per aprire la macroarea, o su un'area per andarci diretto.</p>` +
      `<div class="griglia">${vis.map((x, i) => `<div class="blocco ${x.priv ? 'priv' : ''}" data-vai="#/${x.id}"><h3><span class="n">${i + 1}</span>${x.nome}</h3>` +
        `<div class="aree">${x.aree.map(([a, e]) => `<a href="#/${x.id}/${a}">${e}</a>`).join('')}</div><div class="chiave">${x.chiave()}</div></div>`).join('')}</div>`;
    document.title = 'Cruscotto Economia Italia';
    return;
  }
  const area = m.aree.find(([a]) => a === aId) || m.aree[0], i = vis.indexOf(m) + 1;
  const sel = m.sel ? m.sel() : null;
  let corpo;
  try { corpo = m.f[area[0]](sel); } catch (e) { corpo = `<section class="settore"><p class="bad">✕ Errore nel disegnare quest'area: ${esc(e.message)}</p></section>`; console.error(e); }
  pag.innerHTML = `<div class="testa"><h1><span class="acc">${i}</span> ${m.nome}</h1>${priv}</div>` + m.num() + (sel ? sel.html : '') +
    `<nav class="linguette">${m.aree.map(([a, e]) => `<a href="#/${m.id}/${a}" class="${a === area[0] ? 'on' : ''}">${e}</a>`).join('')}</nav>` + corpo;
  document.title = m.nome + ' · Cruscotto Italia';
}

function scaricaCsv() {

  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + righe.join('\n')], { type: 'text/csv' })); a.download = 'storico Italia.csv'; a.click();
}

    return settore('A', 'Schede dei governi', 'Un governo per colonna. Medie sulle giornate chiuse; il tesoro va dalla fine della giornata prima del mandato alla fine dell\'ultima giornata chiusa.',
      tabella(['', ...G.governi.map((g, i) => `<span style="color:${colGov(i)}">${nomeGov(g)}</span>`)], R.map(([e, f]) => riga([T(e), ...G.governi.map((g) => f(g))]))) +
      `<p class="muto" style="font-size:12px;margin:6px 0 0">${esc(G.nota)}</p>`);
  },
  pari() {
    const G = GV();
    const A = settore('A', 'Saldo accumulato a pari giorno di mandato', 'Somma dei saldi giornalieri (gettito − confini, senza donazioni) dal primo giorno di ogni governo. Più in alto = ha perso meno.',
      linea(G.governi.map((g, i) => ({ nome: g.nome, colore: colGov(i), punti: g.cumulato })), { fy: eur, fx: (x) => 'giorno ' + x, zero: true }));
    const max = Math.max(...G.governi.map((g) => g.cumulato.length));
    const B = settore('B', 'Saldo giorno per giorno', 'Saldo di ogni giornata di mandato, per governo.',
      tabella(['Giorno', ...G.governi.map((g, i) => `<span style="color:${colGov(i)}">${esc(g.nome)}</span>`)], Array.from({ length: max }, (_, k) => riga([k + 1, ...G.governi.map((g) => {
        const c = g.cumulato.find((x) => x[0] === k + 1), p = g.cumulato.find((x) => x[0] === k); return c ? segno(c[1] - (p ? p[1] : 0), eur) : '—'; })]))));
    return A + B;
  },
  tesoro() {
    const G = GV();
    const A = settore('A', 'Tesoro con le fasce dei governi', 'Tesoro dello Stato a fine giornata (e Stato più province), con i periodi dei governi e gli eventi.', fasceGoverni());
    const gi = G.giorni.map((x) => ({ e: giornoIt(x.giorno), v: x.saldo, c: x.provvisorio ? 'fg2' : x.saldo < 0 ? 'bad' : 'ok' }));
    const B = settore('B', 'Saldo di ogni giornata', 'Gettito − confini, senza donazioni. Grigio: giornata in corso.', barre(gi, { fy: eur, h: 200 }));
    const C = settore('C', 'Eventi', 'Cambi di governo, province perse o guadagnate, giornate con più di 50 M€ di donazioni.',
      tabella(['Giorno', 'Evento'], G.eventi.map((e) => riga([giornoIt(e.giorno), T(esc(e.testo))]))));
    return A + B + C;
  },
  // produzione di risorse e copertura per risorsa (26/10/2026 sera, chat (18), richiesta dell'utente)
  risorse() {
    const G = GV(), a = attuale(), prima = G.governi[G.governi.length - 2];
    if (!a.risorse) return attesa('A', 'Produzione e copertura', '', 'arriva con la prossima ricostruzione dei dati');
    const testa = (extra) => ['', ...G.governi.map((g, i) => `<span style="color:${colGov(i)}">${esc(g.nome)}</span>`), ...extra];
    const diff = (x, y) => vuoto(x) || !y ? '—' : `<span class="${x >= y ? 'ok' : 'bad'}">${segno((x / y - 1) * 100, d1)}%</span>`;
    const A = settore('A', 'Produzione di denaro e risorse', 'Gettito medio al giorno di ogni governo (giornate chiuse), denaro e ogni risorsa. L\'ultima colonna confronta il governo in corso con quello prima.',
      tabella(testa(['Rispetto al precedente']), [riga([T('Denaro'), ...G.governi.map((g) => eur(g.gettito)), diff(a.gettito, prima && prima.gettito)]),
        ...R4.map((q) => riga([T(NOME_R[q]), ...G.governi.map((g) => n(g.risorse[q].gettito)), diff(a.risorse[q].gettito, prima && prima.risorse[q].gettito)]))]));
    const cop = (v) => vuoto(v) ? '—' : `<span class="${v >= 100 ? 'ok' : v >= 50 ? 'warn' : 'bad'}">${d1(v)}%</span>`;
    const B = settore('B', 'Copertura dei confini', 'Quanta parte del costo dei confini paga il gettito: solo denaro, e tutto insieme in valore (risorse ai prezzi di adesso). Sopra 100% si paga da solo.',
      tabella(testa([]), [riga([T('Denaro'), ...G.governi.map((g) => cop(g.copertura))]),
        riga([T('Tutto insieme (valore)'), ...G.governi.map((g) => cop(g.copertura_valore))], 'tot')]));
    return A + B;
  },
  province() {
    const G = GV(), a = attuale(), prima = G.governi[G.governi.length - 2];
    const nomi = [...new Set(G.governi.flatMap((g) => Object.keys(g.per_provincia)))];
    nomi.sort((x, y) => (a.per_provincia[y] || 0) - (a.per_provincia[x] || 0));
    return settore('A', 'Gettito delle province sotto ogni governo', 'Gettito medio al giorno di ogni provincia. L\'ultima colonna confronta il governo in corso con quello prima.',
      tabella(['Provincia', ...G.governi.map((g, i) => `<span style="color:${colGov(i)}">${esc(g.nome)}</span>`), 'Rispetto al precedente'], nomi.map((p) => {
        const x = a.per_provincia[p], y = prima ? prima.per_provincia[p] : null, d = vuoto(x) || !y ? null : (x / y - 1) * 100;
        return riga([T(esc(p)), ...G.governi.map((g) => eur(g.per_provincia[p])), d == null ? '—' : `<span class="${d >= 0 ? 'ok' : 'bad'}">${segno(d, d1)}%</span>`]); })));
  },
};
(function () {
  const i = MACRO.findIndex((m) => m.id === 'giocatori');
  MACRO.splice(i < 0 ? MACRO.length : i, 0, { id: 'governi', nome: 'Governi a confronto', num: () => GV() ? m10_numeri() : '', f: m10,
    aree: [['sintesi', 'Come siamo messi'], ['schede', 'Schede dei governi'], ['pari', 'A pari giorno'], ['tesoro', 'Tesoro e eventi'], ['risorse', 'Risorse e copertura'], ['province', 'Province']],
    chiave: () => { if (!GV() || !GV().governi.length) return 'Dati in arrivo con la prossima lettura'; const a = attuale(), pos = Object.entries(GV().voto).sort((x, y) => x[1] - y[1]).findIndex(([k]) => k === a.nome) + 1;
      return `${esc(a.nome)}: ${pos}° su ${GV().governi.length} · saldo ${eur(a.saldo)} al giorno`; } });
  // 1.4 D–E: gettito per denaro e ogni risorsa, in diretta contro ieri alla stessa ora e giorno per giorno (26/10/2026, chat (18))
  const _bil = m1.bilancio;
  m1.bilancio = function () {
    const G = D.gettito_risorse; if (!G) return _bil();
    const fr = (q, v) => q === 'denaro' ? eur(v) : n(v);
    const fs = filtro('Risorsa', 'gett_ris', R5.map((q) => [q, NOME_R[q]]), 'pelle'), q = fs.v, x = G.diretta[q];
    const Dd = settore('D', 'Gettito per risorsa in diretta', 'Denaro e ogni risorsa della giornata del gioco (dalle 22:00), somma delle 7 province a ogni lettura, contro ieri alla stessa ora. Proiezione: oggi finora più quello che ieri è arrivato dopo questa ora.',
      tabella(['Risorsa', 'Oggi finora', 'Ieri alla stessa ora', 'Differenza', 'Ieri in tutto', 'Proiezione a fine giornata'], R5.map((r) => { const y = G.diretta[r];
        return riga([NOME_R[r], fr(r, y.oggi_finora), fr(r, y.ieri_stessa_ora), vuoto(y.variazione_pct) ? '—' : `<span class="${y.variazione_pct < 0 ? 'bad' : 'ok'}">${segno(y.variazione_pct, d1)}%</span>`, fr(r, y.ieri_totale), fr(r, y.proiezione)]); })) +
      fs.html + linea([{ nome: 'Ieri', colore: '#4a5462', punti: x.curva_ieri }, { nome: 'Oggi', colore: 'var(--acc)', punti: x.curva_oggi }], { fx: (h) => d1(h) + ' h', fy: (v) => fr(q, v), titolo: 'gettito di ' + NOME_R[q] }),
      `<p class="muto" style="font-size:12px;margin:0">${esc(G.nota)}</p>`);
    const vv = (g, r) => !g.variazione || vuoto(g.variazione[r]) ? '' : ` <span class="${g.variazione[r] < 0 ? 'bad' : 'ok'}" style="font-size:11px">${segno(g.variazione[r], n)}%</span>`;
    const E = settore('E', 'Gettito giorno per giorno', 'Le ultime giornate del gioco per denaro e ogni risorsa, con la variazione sul giorno prima; valore = denaro più risorse ai prezzi di adesso.',
      tabella(['Giorno', ...R5.map((r) => NOME_R[r]), 'Valore', 'Turni di lavoro'], [...G.giorni].reverse().map((g) => riga([giornoIt(g.giorno) + (g.in_corso ? ' <span class="muto">(in corso)</span>' : ''),
        ...R5.map((r) => fr(r, g[r]) + vv(g, r)), eur(g.valore), n(g.tassazioni)], g.in_corso ? 'sel' : '')),
        G.media_chiusi ? riga(['Media dei giorni chiusi', ...R5.map((r) => fr(r, G.media_chiusi[r])), '', ''], 'tot') : ''));
    return _bil() + Dd + E;
  };
  // 3.7 PREVISIONI (26/10/2026, chat (18); senza mantenimento dal 30/10/2026): gettito
  // dall'andamento degli ultimi giorni, saldo con i soli confini e costo dell'inflazione delle soglie (30/10/2026). Tutto calcolato in previsioni (Python).
  const ms = MACRO.find((m) => m.id === 'stato');
  if (ms && !ms.aree.some(([a]) => a === 'previsioni')) ms.aree.push(['previsioni', 'Previsioni']);
  const TAPPE = ['0', '7', '14', '30', '60'], nomeTappa = (g) => g === '0' ? 'Oggi' : `Fra ${g} giorni`;
  const fq = (q, v) => q === 'denaro' ? eur(v) : n(v);
  const tabTappe = (dati, segnato) => tabella(['Risorsa', ...TAPPE.filter((g) => dati[g]).map(nomeTappa)],
    R5.map((q) => riga([NOME_R[q], ...TAPPE.filter((g) => dati[g]).map((g) => { const v = dati[g][q]; return segnato ? `<span class="${v < 0 ? 'bad' : 'ok'}">${q === 'denaro' ? segno(v, eur) : segno(v)}</span>` : fq(q, v); })])));
  const fxG = (x) => x ? `fra ${x} giorni` : 'oggi';
  m3.previsioni = function () {
    const P = D.previsioni;
    if (!P || !P.saldo) return attesa('A', 'Previsioni', 'Gettito, saldo e costo dell\'inflazione nei prossimi due mesi.', 'arriva con la prossima ricostruzione dei dati');
    const G = P.gettito, tp = P.inflazione.tappe;
    const A = settore('A', 'Gettito previsto', `Gettito della giornata dall'andamento delle ultime ${G.giorni_usati.length} giornate chiuse (${giornoIt(G.giorni_usati[0])}–${giornoIt(G.giorni_usati[G.giorni_usati.length - 1])}): oggi la crescita è ${segno(G.al_giorno.denaro, eur)} al giorno. Si assume che rallenti col tempo e che non vada oltre ±${n(G.tetto * 100)}% del livello di oggi.`,
      linea([{ nome: 'Media delle ultime giornate', colore: '#8a939e', tratteggio: true, punti: G.serie.map((x) => [x[0], x[1]]) },
        { nome: 'Con l\'andamento recente', colore: 'var(--ok)', punti: G.serie.map((x) => [x[0], x[2]]) }], { fy: eur, fx: fxG, titolo: 'gettito previsto' }) +
      tabTappe(G.tappe));
    const B = settore('B', 'Saldo previsto', `Gettito previsto − confini (${eur(P.confini)} al giorno), senza donazioni.`,
      linea([{ nome: 'Gettito in crescita', colore: 'var(--acc)', punti: P.saldo.serie.map((x) => [x[0], x[1]]) },
        { nome: 'Gettito fermo alla media', colore: '#8a939e', tratteggio: true, punti: P.saldo.serie.map((x) => [x[0], x[2]]) }],
        { fy: eur, fx: fxG, zero: true, titolo: 'saldo previsto' }) + tabTappe(P.saldo.tappe, true));
    const C = settore('C', "Costo dell'inflazione delle soglie", `Edifici da aggiungere al riferimento perché ogni indice resti sopra la soglia più la salita al 25%, con i prezzi a curva. Dettagli: ${linkArea('province', 'inflazione', 'Province › Inflazione delle soglie')}.`,
      tabella(['Quando', 'Denaro', 'Valore'], Object.entries(tp).map(([g, x]) => riga([fxG(+g), n(x.risorse.denaro), eur(x.valore)]))));
    return A + B + C + `<p class="muto" style="font-size:12px">${esc(P.nota)}</p>`;
  };
  // 8.1 D: il confronto tra governi ora ha la sua macroarea
  const _st = m8.storico;
  m8.storico = function () { return _st().replace(/<section class="settore attesa"><h4><span class="l">D<\/span>Confronto tra governi[\s\S]*?<\/section>/,
    settore('D', 'Confronto tra governi', 'Le stesse voci per governo, con la pagella e il grafico del tesoro.', `<p style="margin:0">${linkArea('governi', 'sintesi', 'Apri «Governi a confronto» →')}</p>`)); };
})();
